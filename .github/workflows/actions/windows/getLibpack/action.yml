# Cache only the exact reviewed SDK; cache hits receive the same content check.
name: getLibpack
description: "Install or verify a SHA-pinned reviewed Windows LibPack"

inputs:
  libpackdir:
    description: "Fresh destination directory for the SDK"
    required: true
  libpacksdk:
    description: "Reviewed SDK from package/qt-pdf/distribution.json"
    required: false
    default: 3.5.3-x64

runs:
  using: "composite"
  steps:
    - name: Select authenticated SDK cache identity
      shell: pwsh
      id: selection
      env:
        LIBPACK_SDK: ${{ inputs.libpacksdk }}
      run: |
        @'
        import os, sys
        sys.path.insert(0, "package/qt-pdf")
        from install_delivered_libpack import load_delivery
        delivery, _, _ = load_delivery(os.environ["LIBPACK_SDK"])
        with open(os.environ["GITHUB_OUTPUT"], "a") as output:
            output.write("sha256=" + delivery["sha256"] + "\n")
            output.write("index_sha256=" + delivery["index_sha256"] + "\n")
        '@ | python -
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Get cached verified SDK
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      id: getCached
      with:
        path: ${{ inputs.libpackdir }}
        key: libpack-qt-pdf-${{ inputs.libpacksdk }}-${{ steps.selection.outputs.sha256 }}-${{ steps.selection.outputs.index_sha256 }}
    - name: Install or verify exact SDK contents
      shell: pwsh
      env:
        LIBPACK_SDK: ${{ inputs.libpacksdk }}
        LIBPACK_DESTINATION: ${{ inputs.libpackdir }}
        LIBPACK_CACHE_HIT: ${{ steps.getCached.outputs.cache-hit }}
        PYTHONDONTWRITEBYTECODE: "1"
      run: |
        $arguments = @("package/qt-pdf/install_delivered_libpack.py", "--sdk", $env:LIBPACK_SDK, "--destination", $env:LIBPACK_DESTINATION)
        if ($env:LIBPACK_CACHE_HIT -eq 'true') { $arguments += "--verify" }
        python @arguments
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Save authenticated SDK to cache
      if: steps.getCached.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ inputs.libpackdir }}
        key: ${{ steps.getCached.outputs.cache-primary-key }}
