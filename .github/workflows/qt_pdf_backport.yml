# SPDX-License-Identifier: LGPL-2.1-or-later
name: Qt PDF Backport Build

on:
  workflow_dispatch:
    inputs:
      target:
        description: Native package target
        default: all
        type: choice
        options: [all, linux-64, linux-aarch64, osx-64, osx-arm64, win-64]
      libpack_baseline:
        description: Optional baseline-only LibPack diagnostic (skips package builds)
        default: disabled
        type: choice
        options: [disabled, 3.5.3-x64, 3.5.5-x64, 3.5.5-arm64, all]
      libpack_candidate:
        description: Optional LibPack candidate checks (skips package builds)
        default: disabled
        type: choice
        options: [disabled, 3.5.3-x64, 3.5.5-x64, 3.5.5-arm64, all]

permissions:
  contents: read

jobs:
  libpack-baseline:
    if: github.repository == 'zukomgwili/FreeCAD' && (inputs.libpack_baseline || 'disabled') != 'disabled' && (inputs.libpack_candidate || 'disabled') == 'disabled'
    uses: ./.github/workflows/qt_pdf_libpack_baseline.yml
    with:
      sdk: ${{ inputs.libpack_baseline }}

  libpack-candidate:
    if: github.repository == 'zukomgwili/FreeCAD' && (inputs.libpack_candidate || 'disabled') != 'disabled' && (inputs.libpack_baseline || 'disabled') == 'disabled'
    uses: ./.github/workflows/qt_pdf_libpack_backport.yml
    with:
      sdk: ${{ inputs.libpack_candidate }}

  validate-selection:
    if: github.repository == 'zukomgwili/FreeCAD' && (inputs.libpack_candidate || 'disabled') != 'disabled' && (inputs.libpack_baseline || 'disabled') != 'disabled'
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo 'Select either a baseline diagnostic or a candidate build.' >&2
          exit 1

  select:
    if: github.repository == 'zukomgwili/FreeCAD' && (inputs.libpack_baseline || 'disabled') == 'disabled' && (inputs.libpack_candidate || 'disabled') == 'disabled'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        env:
          QT_PDF_SELECTION: ${{ inputs.target || 'all' }}
        run: |
          python3 - <<'PY'
          import json, os
          entries = [
              {"target": "linux-64", "os": "ubuntu-24.04", "jobs": 2},
              {"target": "linux-aarch64", "os": "ubuntu-24.04-arm", "jobs": 2},
              {"target": "osx-64", "os": "macos-15-intel", "jobs": 2},
              {"target": "osx-arm64", "os": "macos-15", "jobs": 1},
              {"target": "win-64", "os": "windows-2022", "jobs": 2},
          ]
          selected = os.environ["QT_PDF_SELECTION"]
          matrix = {"include": [row for row in entries if selected in ("all", row["target"])]}
          assert matrix["include"], "Unsupported target"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("matrix=" + json.dumps(matrix) + "\n")
          PY

  package:
    # Dependency experiments belong to the personal fork until reviewed.
    if: github.repository == 'zukomgwili/FreeCAD' && (inputs.libpack_baseline || 'disabled') == 'disabled' && (inputs.libpack_candidate || 'disabled') == 'disabled'
    needs: select
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 330
    env:
      QT_PDF_TARGET: ${{ matrix.target }}
      CPU_COUNT: ${{ matrix.jobs }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Make space for the complete Qt source build
        if: runner.os == 'Linux'
        uses: AdityaGarg8/remove-unwanted-software@90e01b21170618765a73370fcc3abbd1684a7793 # v5
        with:
          remove-android: 'true'
          remove-cached-tools: 'true'

      - name: Preserve reviewed checkout bytes on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.81.0
          run-install: false
          cache: false

      - name: Create the isolated physical work directory
        id: work-root
        run: |
          pixi exec --spec python=3.13 -- python - <<'PY'
          import os, sys
          from pathlib import Path
          temporary = Path(os.environ["RUNNER_TEMP"]).resolve(strict=True)
          # MSVC's longest generated object exceeded MAX_PATH under RUNNER_TEMP.
          # A real short root survives Python/rattler path canonicalization.
          work = Path(temporary.anchor) / "q" if sys.platform == "win32" else temporary / "qt-pdf-package"
          assert not (work.exists() or work.is_symlink() or work.is_junction()), "Work directory must be fresh"
          work.mkdir(exist_ok=False)
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"QT_PDF_WORK_DIR={work.resolve(strict=True)}\n")
          PY

      - name: Select recorded macOS SDK
        if: runner.os == 'macOS'
        run: |
          test -d /Applications/Xcode_16.4.app
          echo 'DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer' >> "$GITHUB_ENV"
          QT_PDF_SDK=$(DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer xcrun --sdk macosx --show-sdk-path)
          test -d "$QT_PDF_SDK"
          echo "QT_PDF_SDK=$QT_PDF_SDK" >> "$GITHUB_ENV"

      - name: Prepare pinned complete feedstock
        run: |
          qt_pdf_sdk_args=()
          if [ -n "${QT_PDF_SDK:-}" ]; then qt_pdf_sdk_args=(--macos-sdk "$QT_PDF_SDK"); fi
          pixi exec --spec python=3.13 -- python package/qt-pdf/build_backport.py --prepare \
            --work-dir "$QT_PDF_WORK_DIR" --platform "$QT_PDF_TARGET" \
            "${qt_pdf_sdk_args[@]}"

      - name: Record runner provenance
        run: |
          pixi exec --spec python=3.13 -- python - <<'PY'
          import json, os, platform, subprocess
          from pathlib import Path
          record = {
              "commit": os.environ["GITHUB_SHA"],
              "run_url": f'{os.environ["GITHUB_SERVER_URL"]}/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}',
              "target": os.environ["QT_PDF_TARGET"],
              "system": platform.platform(), "machine": platform.machine(),
              "sdk": os.environ.get("QT_PDF_SDK"),
              "developer_dir": os.environ.get("DEVELOPER_DIR"),
              "image_os": os.environ.get("ImageOS"),
              "image_version": os.environ.get("ImageVersion"),
              "cpu_count": os.environ.get("CPU_COUNT"),
              "physical_work_dir": os.environ["QT_PDF_WORK_DIR"],
              "artifact_work_dir": str(Path(os.environ["RUNNER_TEMP"]) / "qt-pdf-package"),
              "qualified": False,
          }
          if platform.system() == "Darwin":
              record["sdk_version"] = subprocess.check_output(["xcrun", "--sdk", "macosx", "--show-sdk-version"], text=True).strip()
          (Path(os.environ["RUNNER_TEMP"]) / "qt-pdf-runner.json").write_text(json.dumps(record, indent=2) + "\n")
          PY

      - name: Build complete Qt package and run native recipe tests
        run: |
          qt_pdf_sdk_args=()
          if [ -n "${QT_PDF_SDK:-}" ]; then qt_pdf_sdk_args=(--macos-sdk "$QT_PDF_SDK"); fi
          pixi exec --spec python=3.13 --spec rattler-build=0.76.1 -- \
            python package/qt-pdf/build_backport.py --build \
            --work-dir "$QT_PDF_WORK_DIR" --platform "$QT_PDF_TARGET" \
            "${qt_pdf_sdk_args[@]}" 2>&1 | tee "$RUNNER_TEMP/qt-pdf-build.log"

      - name: Move Windows evidence to the recorded artifact layout
        id: work-transport
        if: always() && runner.os == 'Windows' && steps.work-root.outcome == 'success'
        run: |
          pixi exec --spec python=3.13 -- python - <<'PY'
          import os
          from pathlib import Path
          temporary = Path(os.environ["RUNNER_TEMP"]).resolve(strict=True)
          work = Path(os.environ["QT_PDF_WORK_DIR"])
          assert work == Path(temporary.anchor) / "q", "Unexpected physical work directory"
          assert work.is_dir() and not (work.is_symlink() or work.is_junction()), "Work directory must be real"
          destination = temporary / "qt-pdf-package"
          assert not (destination.exists() or destination.is_symlink() or destination.is_junction()), "Artifact destination must be fresh"
          # Same-volume rename preserves bytes and original build.json commands.
          work.rename(destination)
          PY

      - name: Retain package, corresponding source and build evidence
        if: always() && steps.work-root.outcome == 'success' && (runner.os != 'Windows' || steps.work-transport.outcome == 'success')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qt-pdf-backport-${{ matrix.target }}
          retention-days: 30
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/qt-pdf-package/feedstock.tar.gz
            ${{ runner.temp }}/qt-pdf-package/feedstock
            ${{ runner.temp }}/qt-pdf-package/recipe.diff
            ${{ runner.temp }}/qt-pdf-package/build-scripts.diff
            ${{ runner.temp }}/qt-pdf-package/provenance.json
            ${{ runner.temp }}/qt-pdf-package/build.json
            ${{ runner.temp }}/qt-pdf-package/output/${{ matrix.target }}/qt6-main-*.conda
            ${{ runner.temp }}/qt-pdf-package/output/src_cache/*_qt-everywhere-src-6.11.2.tar.xz
            ${{ runner.temp }}/qt-pdf-package/output/src_cache/*_opengl32sw-64-mesa_12_0_rc2.7z
            ${{ runner.temp }}/qt-pdf-build.log
            ${{ runner.temp }}/qt-pdf-runner.json
